

services:
  postgres:
    image: postgres:15-alpine
    container_name: devlab_pg
    environment:
      POSTGRES_USER: devlab
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: devlabdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: